<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Abass Ibrahim — Full-Stack and AI Product Engineer</title>
  <desc id="desc">An animated systems interface connecting product engineering, artificial intelligence, commerce, and immersive experiences.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/><stop offset=".5" stop-color="#0B1424"/><stop offset="1" stop-color="#120C20"/>
    </linearGradient>
    <linearGradient id="line" x1="146" y1="90" x2="1050" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58E6FF"/><stop offset=".5" stop-color="#7C8CFF"/><stop offset="1" stop-color="#F18BFF"/>
    </linearGradient>
    <radialGradient id="aura"><stop stop-color="#55DFFF" stop-opacity=".35"/><stop offset="1" stop-color="#55DFFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#8BA4C7" stroke-opacity=".1"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .bg{fill:url(#bg)}.frame{stroke:#26374F}.copy{fill:#EAF4FF}.muted{fill:#94A8C2}.chip{fill:#0D1A2A;stroke:#30445E}.grid{opacity:.8}
      .aurora{animation:drift 9s ease-in-out infinite alternate}.orbit{transform-origin:930px 215px;animation:spin 18s linear infinite}.packet{stroke-dasharray:3 20;animation:flow 2.8s linear infinite}.float{animation:float 4s ease-in-out infinite}.blink{animation:blink 1.4s steps(2,end) infinite}.pulse{transform-origin:center;animation:pulse 2.6s ease-out infinite}.reveal{animation:reveal 1.2s ease-out both}
      @keyframes drift{to{transform:translate(85px,-18px) scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-46}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes blink{50%{opacity:.18}}@keyframes pulse{70%,100%{transform:scale(1.7);opacity:0}}@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @media(prefers-color-scheme:light){.bg{fill:#F7FAFF}.frame{stroke:#CBD8E8}.copy{fill:#102039}.muted{fill:#52657D}.chip{fill:#FFFFFF;stroke:#CFDAE8}.grid{opacity:.45}}
      @media(prefers-reduced-motion:reduce){.aurora,.orbit,.packet,.float,.blink,.pulse,.reveal{animation:none!important}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="28" class="bg frame"/>
  <rect x="1" y="1" width="1198" height="428" rx="28" fill="url(#grid)" class="grid"/>
  <circle cx="830" cy="105" r="255" fill="url(#aura)" class="aurora"/>
  <path d="M0 350C190 300 320 402 515 340S840 292 1200 350V430H0Z" fill="#6879FF" fill-opacity=".06"/>

  <g class="reveal">
    <rect x="54" y="48" width="138" height="32" rx="16" class="chip"/>
    <circle cx="74" cy="64" r="5" fill="#56E6A5"/><circle cx="74" cy="64" r="5" fill="none" stroke="#56E6A5" class="pulse"/>
    <text x="88" y="69" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1.4" class="muted">SYSTEM ONLINE</text>
    <text x="54" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="3" fill="#63DEFF">ABASS IBRAHIM</text>
    <text x="54" y="211" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="750" class="copy">Full-Stack &amp; AI</text>
    <text x="54" y="265" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="750" class="copy">Product Engineer<tspan class="blink" fill="#69E4FF">_</tspan></text>
    <text x="56" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" class="muted">Design → architecture → intelligence → production</text>
    <text x="56" y="366" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#90A7C3">LAGOS, NG  /  TRUSTCODE SYSTEM LIMITED</text>
  </g>

  <g class="float">
    <circle cx="930" cy="215" r="121" fill="#101D31" fill-opacity=".68" stroke="#536985" stroke-opacity=".5"/>
    <circle cx="930" cy="215" r="87" fill="#0B1626" stroke="url(#line)" stroke-width="2" stroke-opacity=".65"/>
    <g class="orbit">
      <circle cx="930" cy="94" r="6" fill="#62E4FF" filter="url(#glow)"/>
      <circle cx="1035" cy="274" r="5" fill="#F18BFF" filter="url(#glow)"/>
      <circle cx="834" cy="289" r="5" fill="#7C8CFF" filter="url(#glow)"/>
    </g>
    <path d="M888 207C888 177 905 158 930 158C955 158 972 177 972 207V253C972 261 962 265 956 260L944 250L932 261C928 265 922 265 918 261L906 250L894 260C888 265 880 261 880 253V207C880 177 900 158 930 158Z" fill="url(#line)" filter="url(#glow)"/>
    <ellipse cx="913" cy="207" rx="6" ry="9" fill="#091321"/><ellipse cx="947" cy="207" rx="6" ry="9" fill="#091321"/>
    <path d="M918 229C925 236 936 236 943 229" stroke="#091321" stroke-width="4" stroke-linecap="round"/>
  </g>

  <path d="M687 112C750 112 755 155 815 155" stroke="url(#line)" stroke-width="2" stroke-opacity=".45" class="packet"/>
  <path d="M687 325C760 325 763 280 820 280" stroke="url(#line)" stroke-width="2" stroke-opacity=".45" class="packet"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1">
    <rect x="1017" y="103" width="128" height="32" rx="16" class="chip"/><text x="1036" y="124" class="muted">AI SYSTEMS</text>
    <rect x="1027" y="295" width="118" height="32" rx="16" class="chip"/><text x="1046" y="316" class="muted">COMMERCE</text>
    <rect x="746" y="74" width="112" height="32" rx="16" class="chip"/><text x="765" y="95" class="muted">PLATFORMS</text>
    <rect x="724" y="339" width="134" height="32" rx="16" class="chip"/><text x="743" y="360" class="muted">IMMERSIVE UI</text>
  </g>
</svg>
