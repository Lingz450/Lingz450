<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="sc-title sc-desc">
  <title id="sc-title">Working toolkit constellation</title>
  <desc id="sc-desc">Three orbital rings carrying the interface, API, and AI technologies used in current work, circling a rotating core.</desc>
  <defs>
    <linearGradient id="sc-core" x1="540" y1="160" x2="660" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DE1FF"/><stop offset=".5" stop-color="#7788FF"/><stop offset="1" stop-color="#EF8CFF"/>
    </linearGradient>
    <radialGradient id="sc-halo" cx=".5" cy=".5" r=".5">
      <stop stop-color="#55DFFF" stop-opacity=".28"/><stop offset="1" stop-color="#55DFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sc-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#8BA4C7" stroke-opacity=".1"/></pattern>
    <filter id="sc-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sc-panel"><rect x="1" y="1" width="1198" height="418" rx="24"/></clipPath>

    <path id="scA" d="M130 210 a470 118 0 1 0 940 0 a470 118 0 1 0 -940 0" fill="none"/>
    <path id="scB" d="M250 210 a350 160 0 1 1 700 0 a350 160 0 1 1 -700 0" fill="none"/>
    <path id="scC" d="M400 210 a200 92 0 1 0 400 0 a200 92 0 1 0 -400 0" fill="none"/>

    <style>
      .panel{fill:#0A1423;stroke:#283B54}
      .ring{stroke:#8BA4C7;stroke-opacity:.22;stroke-width:1.5}
      .chip rect{fill:#0C1826}
      .chip text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;fill:#DDEBFA}
      .cA rect{stroke:#4DE1FF;stroke-opacity:.75}.cA circle{fill:#4DE1FF}
      .cB rect{stroke:#7788FF;stroke-opacity:.75}.cB circle{fill:#7788FF}
      .cC rect{stroke:#EF8CFF;stroke-opacity:.75}.cC circle{fill:#EF8CFF}
      .coretext{fill:#04222E}
      .cap{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#8298B4}
      .halo{animation:halo 6s ease-in-out infinite}
      @keyframes halo{0%,100%{opacity:.55}50%{opacity:1}}
      .tw{animation:tw 3.6s ease-in-out infinite}.tw2{animation-delay:1.2s}.tw3{animation-delay:2.4s}
      @keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}
      @media(prefers-color-scheme:light){
        .panel{fill:#F7FAFF;stroke:#CBD8E8}
        .ring{stroke:#5B7392;stroke-opacity:.3}
        .chip rect{fill:#FFFFFF}
        .chip text{fill:#15263D}
        .cA rect{stroke:#0A6E86}.cA circle{fill:#0A6E86}
        .cB rect{stroke:#3B4CD8}.cB circle{fill:#3B4CD8}
        .cC rect{stroke:#A226C4}.cC circle{fill:#A226C4}
        .coretext{fill:#FFFFFF}
        .cap{fill:#61748C}
      }
      @media(prefers-reduced-motion:reduce){.halo,.tw{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#sc-panel)">
    <rect x="1" y="1" width="1198" height="418" rx="24" class="panel" stroke-width="2"/>
    <rect x="1" y="1" width="1198" height="418" rx="24" fill="url(#sc-grid)"/>

    <g fill="#7FC9FF">
      <circle class="tw"  cx="120" cy="60"  r="1.6"/>
      <circle class="tw2" cx="380" cy="42"  r="1.3"/>
      <circle class="tw3" cx="820" cy="58"  r="1.5"/>
      <circle class="tw"  cx="1090" cy="96" r="1.4"/>
      <circle class="tw2" cx="180" cy="370" r="1.5"/>
      <circle class="tw3" cx="1010" cy="376" r="1.3"/>
    </g>

    <ellipse class="halo" cx="600" cy="210" rx="300" ry="170" fill="url(#sc-halo)"/>

    <use href="#scA" xlink:href="#scA" class="ring"/>
    <use href="#scB" xlink:href="#scB" class="ring"/>
    <use href="#scC" xlink:href="#scC" class="ring"/>

    <g fill="none" stroke="#4DE1FF" stroke-width="1.5">
      <circle cx="600" cy="210" r="54">
        <animate attributeName="r" values="54;300" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".4;0" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="210" r="54">
        <animate attributeName="r" values="54;300" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".4;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="210" r="54">
        <animate attributeName="r" values="54;300" dur="4.5s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".4;0" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle r="3" fill="#4DE1FF" filter="url(#sc-glow)">
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#scA" xlink:href="#scA"/></animateMotion>
    </circle>
    <circle r="2.6" fill="#7788FF" filter="url(#sc-glow)">
      <animateMotion dur="7.5s" repeatCount="indefinite"><mpath href="#scB" xlink:href="#scB"/></animateMotion>
    </circle>
    <circle r="2.6" fill="#EF8CFF" filter="url(#sc-glow)">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#scC" xlink:href="#scC"/></animateMotion>
    </circle>

    <g filter="url(#sc-glow)">
      <path d="M600 163 L641 186 L641 234 L600 257 L559 234 L559 186 Z" fill="url(#sc-core)" stroke="#D8FAFF" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="26s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="600" y="217" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20" font-weight="700" class="coretext">&lt;/&gt;</text>

    <!-- Ring A: product interfaces -->
    <g class="chip cA">
      <animateMotion dur="28s" repeatCount="indefinite"><mpath href="#scA" xlink:href="#scA"/></animateMotion>
      <animate attributeName="opacity" dur="28s" repeatCount="indefinite" values=".75;.4;.75;1;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-57" y="-15" width="114" height="30" rx="15"/><circle cx="-41" cy="0" r="4.5"/><text x="-29" y="4.5">TypeScript</text>
    </g>
    <g class="chip cA">
      <animateMotion dur="28s" begin="-7s" repeatCount="indefinite"><mpath href="#scA" xlink:href="#scA"/></animateMotion>
      <animate attributeName="opacity" dur="28s" begin="-7s" repeatCount="indefinite" values=".75;.4;.75;1;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-46" y="-15" width="92" height="30" rx="15"/><circle cx="-30" cy="0" r="4.5"/><text x="-18" y="4.5">Next.js</text>
    </g>
    <g class="chip cA">
      <animateMotion dur="28s" begin="-14s" repeatCount="indefinite"><mpath href="#scA" xlink:href="#scA"/></animateMotion>
      <animate attributeName="opacity" dur="28s" begin="-14s" repeatCount="indefinite" values=".75;.4;.75;1;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-49" y="-15" width="98" height="30" rx="15"/><circle cx="-33" cy="0" r="4.5"/><text x="-21" y="4.5">Three.js</text>
    </g>
    <g class="chip cA">
      <animateMotion dur="28s" begin="-21s" repeatCount="indefinite"><mpath href="#scA" xlink:href="#scA"/></animateMotion>
      <animate attributeName="opacity" dur="28s" begin="-21s" repeatCount="indefinite" values=".75;.4;.75;1;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-49" y="-15" width="98" height="30" rx="15"/><circle cx="-33" cy="0" r="4.5"/><text x="-21" y="4.5">Tailwind</text>
    </g>

    <!-- Ring B: APIs and data -->
    <g class="chip cB">
      <animateMotion dur="22s" repeatCount="indefinite"><mpath href="#scB" xlink:href="#scB"/></animateMotion>
      <animate attributeName="opacity" dur="22s" repeatCount="indefinite" values=".75;1;.75;.4;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-42" y="-15" width="84" height="30" rx="15"/><circle cx="-26" cy="0" r="4.5"/><text x="-14" y="4.5">NestJS</text>
    </g>
    <g class="chip cB">
      <animateMotion dur="22s" begin="-5.5s" repeatCount="indefinite"><mpath href="#scB" xlink:href="#scB"/></animateMotion>
      <animate attributeName="opacity" dur="22s" begin="-5.5s" repeatCount="indefinite" values=".75;1;.75;.4;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-46" y="-15" width="92" height="30" rx="15"/><circle cx="-30" cy="0" r="4.5"/><text x="-18" y="4.5">FastAPI</text>
    </g>
    <g class="chip cB">
      <animateMotion dur="22s" begin="-11s" repeatCount="indefinite"><mpath href="#scB" xlink:href="#scB"/></animateMotion>
      <animate attributeName="opacity" dur="22s" begin="-11s" repeatCount="indefinite" values=".75;1;.75;.4;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-57" y="-15" width="114" height="30" rx="15"/><circle cx="-41" cy="0" r="4.5"/><text x="-29" y="4.5">PostgreSQL</text>
    </g>
    <g class="chip cB">
      <animateMotion dur="22s" begin="-16.5s" repeatCount="indefinite"><mpath href="#scB" xlink:href="#scB"/></animateMotion>
      <animate attributeName="opacity" dur="22s" begin="-16.5s" repeatCount="indefinite" values=".75;1;.75;.4;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-38" y="-15" width="76" height="30" rx="15"/><circle cx="-22" cy="0" r="4.5"/><text x="-10" y="4.5">Redis</text>
    </g>

    <!-- Ring C: AI core -->
    <g class="chip cC">
      <animateMotion dur="16s" repeatCount="indefinite"><mpath href="#scC" xlink:href="#scC"/></animateMotion>
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values=".75;.4;.75;1;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-30" y="-15" width="60" height="30" rx="15"/><circle cx="-14" cy="0" r="4.5"/><text x="-2" y="4.5">RAG</text>
    </g>
    <g class="chip cC">
      <animateMotion dur="16s" begin="-5.33s" repeatCount="indefinite"><mpath href="#scC" xlink:href="#scC"/></animateMotion>
      <animate attributeName="opacity" dur="16s" begin="-5.33s" repeatCount="indefinite" values=".75;.4;.75;1;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-49" y="-15" width="98" height="30" rx="15"/><circle cx="-33" cy="0" r="4.5"/><text x="-21" y="4.5">pgvector</text>
    </g>
    <g class="chip cC">
      <animateMotion dur="16s" begin="-10.67s" repeatCount="indefinite"><mpath href="#scC" xlink:href="#scC"/></animateMotion>
      <animate attributeName="opacity" dur="16s" begin="-10.67s" repeatCount="indefinite" values=".75;.4;.75;1;.75" keyTimes="0;.25;.5;.75;1"/>
      <rect x="-53" y="-15" width="106" height="30" rx="15"/><circle cx="-37" cy="0" r="4.5"/><text x="-25" y="4.5">Anthropic</text>
    </g>

    <text x="600" y="404" text-anchor="middle" font-size="13" class="cap">interfaces · APIs and data · AI systems</text>
  </g>
</svg>
