<svg width="1200" height="290" viewBox="0 0 1200 290" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Product capability network</title>
  <desc id="desc">Animated signals connect AI systems, product platforms, commerce operations, and immersive interfaces to shipped outcomes.</desc>
  <defs>
    <linearGradient id="rail" x1="100" y1="145" x2="1100" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#4DE1FF"/><stop offset=".5" stop-color="#7788FF"/><stop offset="1" stop-color="#EF8CFF"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="po-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
    <radialGradient id="po-halo"><stop stop-color="#55DFFF" stop-opacity=".26"/><stop offset="1" stop-color="#55DFFF" stop-opacity="0"/></radialGradient>
    <pattern id="po-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#8BA4C7" stroke-opacity=".1"/></pattern>
    <clipPath id="po-panel"><rect x="1" y="1" width="1198" height="288" rx="24"/></clipPath>
    <style>
      .halo{animation:halo 7s ease-in-out infinite}
      @keyframes halo{0%,100%{opacity:.5}50%{opacity:1}}
      .tw{animation:tw 3.6s ease-in-out infinite}.tw2{animation-delay:1.2s}.tw3{animation-delay:2.4s}
      @keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}
      .panel{fill:#0A1423;stroke:#283B54}.label{fill:#DDEBFA}.sub{fill:#8298B4}.rail{stroke:url(#rail);stroke-opacity:.32}.signal{stroke:url(#rail);stroke-dasharray:4 26;animation:flow 3s linear infinite}
      .fill{stroke:url(#rail);stroke-dasharray:950;stroke-dashoffset:950;animation:fill 12s cubic-bezier(.65,0,.35,1) infinite,fillfade 12s linear infinite}
      .node{animation:ignite 12s ease-in-out infinite backwards}.ping{animation:ping 12s ease-out infinite backwards}
      .n2{animation-delay:2.64s}.n3{animation-delay:5.28s}.n4{animation-delay:7.92s}
      .packet{animation:travel 12s cubic-bezier(.65,0,.35,1) infinite,packetfade 12s linear infinite}.packet2{animation-delay:-6s}
      @keyframes flow{to{stroke-dashoffset:-60}}
      @keyframes travel{0%,8%{transform:translateX(0)}22%,30%{transform:translateX(300px)}44%,52%{transform:translateX(600px)}66%,100%{transform:translateX(900px)}}
      @keyframes packetfade{0%,4%{opacity:0}8%,88%{opacity:1}96%,100%{opacity:0}}
      @keyframes fill{0%,8%{stroke-dashoffset:950}22%,30%{stroke-dashoffset:650}44%,52%{stroke-dashoffset:350}66%,100%{stroke-dashoffset:50}}
      @keyframes fillfade{0%,4%{opacity:0}8%,88%{opacity:.9}96%,100%{opacity:0}}
      @keyframes ignite{0%{opacity:.55}2%{opacity:1}18%{opacity:1}22%{opacity:.55}100%{opacity:.55}}
      @keyframes ping{0%{r:45;opacity:0}1%{r:45;opacity:.7}14%{r:74;opacity:0}100%{r:45;opacity:0}}
      @media(prefers-color-scheme:light){.panel{fill:#FFFFFF;stroke:#D2DDEA}.label{fill:#15263D}.sub{fill:#61748C}.rail{stroke-opacity:.24}}
      @media(prefers-reduced-motion:reduce){.signal,.node,.packet,.fill,.ping,.halo,.tw{animation:none!important}.node{opacity:1}.fill{stroke-dashoffset:50;opacity:.9}.ping{opacity:0}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="288" rx="24" class="panel" stroke-width="2"/>
  <g clip-path="url(#po-panel)">
    <rect x="1" y="1" width="1198" height="288" rx="24" fill="url(#po-grid)"/>
    <ellipse class="halo" cx="600" cy="145" rx="420" ry="130" fill="url(#po-halo)" filter="url(#po-soft)"/>
    <g fill="#9FD8FF">
      <circle class="tw"  cx="90"   cy="52"  r="1.5"/>
      <circle class="tw2" cx="340"  cy="40"  r="1.3"/>
      <circle class="tw3" cx="880"  cy="46"  r="1.4"/>
      <circle class="tw"  cx="1120" cy="248" r="1.4"/>
      <circle class="tw2" cx="240"  cy="252" r="1.3"/>
    </g>
  </g>
  <path d="M125 145H1075" class="rail" stroke-width="2"/>
  <path d="M125 145H1075" class="fill" stroke-width="3" stroke-linecap="round"/>
  <path d="M125 145H1075" class="signal" stroke-width="3"/>
  <circle cx="150" cy="145" r="8" fill="#50DFFF" filter="url(#glow)" class="packet"/>
  <circle cx="150" cy="145" r="5" fill="#EF8CFF" filter="url(#glow)" class="packet packet2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g class="node"><circle class="ping" cx="150" cy="145" r="45" fill="none" stroke="#4DDBF7"/><circle cx="150" cy="145" r="45" fill="#102638" stroke="#4DDBF7"/><circle cx="150" cy="145" r="32" fill="#4DDBF7" fill-opacity=".1"/><text x="150" y="139" class="label" font-size="16" font-weight="700">AI</text><text x="150" y="160" class="sub" font-size="11">GROUND</text></g>
    <g class="node n2"><circle class="ping n2" cx="450" cy="145" r="45" fill="none" stroke="#7888FF"/><circle cx="450" cy="145" r="45" fill="#171F3D" stroke="#7888FF"/><circle cx="450" cy="145" r="32" fill="#7888FF" fill-opacity=".1"/><text x="450" y="139" class="label" font-size="16" font-weight="700">BUILD</text><text x="450" y="160" class="sub" font-size="11">SYSTEMS</text></g>
    <g class="node n3"><circle class="ping n3" cx="750" cy="145" r="45" fill="none" stroke="#B77EFF"/><circle cx="750" cy="145" r="45" fill="#251B3B" stroke="#B77EFF"/><circle cx="750" cy="145" r="32" fill="#B77EFF" fill-opacity=".1"/><text x="750" y="139" class="label" font-size="16" font-weight="700">REFINE</text><text x="750" y="160" class="sub" font-size="11">EXPERIENCE</text></g>
    <g class="node n4"><circle class="ping n4" cx="1050" cy="145" r="45" fill="none" stroke="#EF8CFF"/><circle cx="1050" cy="145" r="45" fill="#311A36" stroke="#EF8CFF"/><circle cx="1050" cy="145" r="32" fill="#EF8CFF" fill-opacity=".1"/><text x="1050" y="139" class="label" font-size="16" font-weight="700">SHIP</text><text x="1050" y="160" class="sub" font-size="11">OUTCOMES</text></g>
    <text x="600" y="54" class="label" font-size="18" font-weight="700" letter-spacing="2">FROM AMBIGUOUS IDEA TO WORKING PRODUCT</text>
    <text x="600" y="242" class="sub" font-size="13">product thinking · architecture · intelligence · interface craft · verification</text>
  </g>
</svg>
